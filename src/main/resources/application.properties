# ==============================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ==============================================================================
spring.application.name=biblioteca-zegel
server.port=8080

# ==============================================================================
# BASE DE DATOS EMBEBIDA H2
# ==============================================================================
spring.datasource.url=jdbc:h2:file:./data/bibliotecadb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola Web de H2 accesible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================================================================
# JPA / HIBERNATE
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# SEGURIDAD JWT (JSON Web Token)
# Clave secreta codificada en Base64 (mínimo 256 bits para HS256)
# ==============================================================================
app.jwt.secret=WmVnZWxCaWJsaW90ZWNhU2VjcmV0S2V5MjAyNkV2YWx1YWNpb25GaW5hbFNlZ3VyaWRhZUpXVA==
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# ==============================================================================
# DOCUMENTACIÓN SWAGGER / OPENAPI
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
